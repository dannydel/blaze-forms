name: Feature request
description: Propose a new feature or enhancement for BlazeForms
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? What's missing or awkward today?
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: What would you like to see? Include API shape, schema impact, or UI behavior if relevant.
    validations:
      required: true
  - type: textarea
    id: prd-alignment
    attributes:
      label: PRD alignment
      description: |
        Does this fit within the scope and phasing already decided in docs/PRD.md? If it's already covered by a planned phase, link the section. If it's a new direction, say so explicitly — scope and phasing changes go through the PRD decision log, not directly through an issue.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
