name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: >
          dotnet test -c Release --no-build
          --collect:"XPlat Code Coverage" --results-directory coverage

      - name: Validate the published JSON Schema against the golden definition
        run: |
          schema=$(ls docs/schemas/form-definition-v*.schema.json | sort -V | tail -n1)
          version=$(basename "$schema" | sed -E 's/form-definition-v([0-9]+)\.schema\.json/\1/')
          golden="tests/BlazeForms.Core.Tests/Golden/form-definition-v${version}.json"
          echo "Validating $golden against $schema"
          npx --yes ajv-cli validate -s "$schema" -d "$golden" --spec=draft2020

      - name: Pack packable projects
        run: |
          dotnet pack src/BlazeForms.Core -c Release --no-build -o artifacts
          dotnet pack src/BlazeForms.Renderer -c Release --no-build -o artifacts
          dotnet pack src/BlazeForms.Designer -c Release --no-build -o artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*.nupkg
          retention-days: 7

      # Coverage is informational — it must never block the pack signal above, hence
      # if: always() plus continue-on-error and the file-existence guard below.
      - name: Generate coverage summary
        if: always()
        continue-on-error: true
        uses: danielpalme/ReportGenerator-GitHub-Action@v5
        with:
          reports: coverage/**/coverage.cobertura.xml
          targetdir: coverage-report
          reporttypes: MarkdownSummaryGithub

      - name: Append coverage summary
        if: always()
        continue-on-error: true
        run: '[ -f coverage-report/SummaryGithub.md ] && cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY" || true'

      - name: Upload coverage reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: coverage-cobertura
          path: coverage/**/coverage.cobertura.xml
          retention-days: 7

  # Deliberately outside BlazeForms.sln (PRD §11; PRD §14 #3): this job needs
  # Playwright's Chromium download and a real socket for an Interactive Server circuit, neither of
  # which the build-and-test job above should ever have to pay for. Gates the renderer half of the
  # "Playwright + axe report zero WCAG 2.2 AA violations" success criterion — AGENTS.md invariant
  # #4 — on the shipped-default components the sample serves at /fill and /submission/{id}.
  e2e-a11y:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build the sample host and the E2E test project
        run: |
          dotnet build samples/BlazeForms.Sample -c Release
          dotnet build tests/BlazeForms.E2E.Tests -c Release

      - name: Install Playwright's Chromium
        run: pwsh tests/BlazeForms.E2E.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run the Playwright + axe accessibility gate
        run: dotnet test tests/BlazeForms.E2E.Tests -c Release --no-build

  # Independent of build-and-test: a plain `dotnet build` never runs the trimmer, and never
  # exercises base-href-relative navigation, so this is the only per-PR signal for a publish/trim
  # regression *and* for a routing regression like a root-absolute href silently bypassing the
  # router once the app isn't served from "/" (adoption-infrastructure-plan Increment D).
  # SuppressTrimAnalysisWarnings=false lives in the demo's own csproj, not here.
  demo-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Assembled at a scratch base href identical in shape to the real deploy path, via the same
      # script pages.yml uses, so the base-href rewrite + grep guard run on every PR -- not only
      # on push to main.
      - name: Assemble the demo at a Pages-shaped base href
        run: eng/assemble-demo.sh /tmp/demo-site/blaze-forms/demo "/blaze-forms/demo/"

      - name: Install Playwright's Chromium
        run: npx --yes playwright install --with-deps chromium

      - name: Serve the assembled demo (mimicking GitHub Pages' 404.html fallback)
        run: |
          nohup python3 eng/serve-with-404-fallback.py 8123 /tmp/demo-site > /tmp/demo-serve.log 2>&1 &
          for _ in $(seq 1 20); do
            curl -sf -o /dev/null http://127.0.0.1:8123/blaze-forms/demo/ && exit 0
            sleep 0.5
          done
          echo "::error::demo server never became reachable"; cat /tmp/demo-serve.log; exit 1

      # Catches exactly the class of bug a green publish can't: base-href-relative navigation,
      # a real fill-and-submit flow, and a hard-refresh deep link through the 404.html fallback.
      - name: Run the demo smoke test
        run: npx --yes -p playwright node eng/demo-smoke-test.mjs "http://127.0.0.1:8123/blaze-forms/demo/"
