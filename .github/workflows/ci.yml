name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build

  # Deliberately outside BlazeForms.sln (AGENTS.md §Testing; PRD §11, §14 #3): this job needs
  # Playwright's Chromium download and a real socket for an Interactive Server circuit, neither of
  # which the build-and-test job above should ever have to pay for. Gates the renderer half of the
  # "Playwright + axe report zero WCAG 2.2 AA violations" success criterion — AGENTS.md invariant
  # #4 — on the shipped-default components the sample serves at /fill and /submission/{id}.
  e2e-a11y:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build the sample host and the E2E test project
        run: |
          dotnet build samples/BlazeForms.Sample -c Release
          dotnet build tests/BlazeForms.E2E.Tests -c Release

      - name: Install Playwright's Chromium
        run: pwsh tests/BlazeForms.E2E.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run the Playwright + axe accessibility gate
        run: dotnet test tests/BlazeForms.E2E.Tests -c Release --no-build
