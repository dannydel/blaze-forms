name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Assemble site
        run: |
          mkdir -p _site/schemas
          cp docs/schemas/*.schema.json _site/schemas/
          cp docs/pages/index.html _site/index.html
          touch _site/.nojekyll

          # Publish, copy, base-href rewrite (+ grep guard), and demo/404.html all live in one
          # script shared with ci.yml's demo-publish job, so the rewrite and guard run on every
          # PR too, not only here on push to main.
          eng/assemble-demo.sh _site/demo "/blaze-forms/demo/"

          # GitHub only documents a root-level 404.html fallback for the whole site (the
          # per-directory demo/404.html above is the belt; this is the suspenders) -- a byte copy
          # of the same rewritten shell means any unmatched path still boots the demo and lets the
          # Blazor router resolve it, whichever 404.html GitHub Pages actually picks.
          cp _site/demo/404.html _site/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
